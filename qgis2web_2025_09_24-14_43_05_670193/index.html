<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <link rel="stylesheet" href="css/leaflet.css">
        <link rel="stylesheet" href="css/qgis2web.css"><link rel="stylesheet" href="css/fontawesome-all.min.css">
        <style>
        #map {
            width: 990px;
            height: 814px;
        }
        </style>
        <title>Социально-экономическая карта Австрии</title>
    </head>
    <body>
        <div id="map">
        </div>
        <script src="js/qgis2web_expressions.js"></script>
        <script src="js/leaflet.js"></script>
        <script src="js/leaflet.rotatedMarker.js"></script>
        <script src="js/leaflet.pattern.js"></script>
        <script src="js/leaflet-hash.js"></script>
        <script src="js/Autolinker.min.js"></script>
        <script src="js/rbush.min.js"></script>
        <script src="js/labelgun.min.js"></script>
        <script src="js/labels.js"></script>
        <script src="data/Austria_1.js"></script>
        <script src="data/Austria_2.js"></script>
        <script>
        var highlightLayer;
        function highlightFeature(e) {
            highlightLayer = e.target;

            if (e.target.feature.geometry.type === 'LineString') {
              highlightLayer.setStyle({
                color: '#5aff01',
              });
            } else {
              highlightLayer.setStyle({
                fillColor: '#5aff01',
                fillOpacity: 1
              });
            }
            highlightLayer.openPopup();
        }
        var map = L.map('map', {
            zoomControl:true, maxZoom:28, minZoom:1
        }).fitBounds([[44.56934616847463,7.868349960208703],[50.52157042102944,18.614095355102904]]);
        var hash = new L.Hash(map);
        map.attributionControl.setPrefix('<a href="https://github.com/tomchadwin/qgis2web" target="_blank">qgis2web</a> &middot; <a href="https://leafletjs.com" title="A JS library for interactive maps">Leaflet</a> &middot; <a href="https://qgis.org">QGIS</a>');
        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});
        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        document.querySelector(".leaflet-popup-pane").addEventListener("load", function(event) {
          var tagName = event.target.tagName,
            popup = map._popup;
          // Also check if flag is already set.
          if (tagName === "IMG" && popup && !popup._updated) {
            popup._updated = true; // Set flag to prevent looping.
            popup.update();
          }
        }, true);
        var bounds_group = new L.featureGroup([]);
        function setBounds() {
        }
        map.createPane('pane_ESRIStandard_0');
        map.getPane('pane_ESRIStandard_0').style.zIndex = 400;
        var layer_ESRIStandard_0 = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
            pane: 'pane_ESRIStandard_0',
            opacity: 1.0,
            attribution: '',
            minZoom: 1,
            maxZoom: 28,
            minNativeZoom: 0,
            maxNativeZoom: 20
        });
        layer_ESRIStandard_0;
        map.addLayer(layer_ESRIStandard_0);
        function pop_Austria_1(feature, layer) {
            layer.on({
                mouseout: function(e) {
                    for (i in e.target._eventParents) {
                        e.target._eventParents[i].resetStyle(e.target);
                    }
                    if (typeof layer.closePopup == 'function') {
                        layer.closePopup();
                    } else {
                        layer.eachLayer(function(feature){
                            feature.closePopup()
                        });
                    }
                },
                mouseover: highlightFeature,
            });
            var popupContent = '<table>\
                    <tr>\
                        <th scope="row">Industry_specialization</th>\
                        <td>' + (feature.properties['Industry_specialization'] !== null ? autolinker.link(feature.properties['Industry_specialization'].toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">The city_contribution_to_the_country_GDP_%</th>\
                        <td>' + (feature.properties['The city_contribution_to_the_country_GDP_%'] !== null ? autolinker.link(feature.properties['The city_contribution_to_the_country_GDP_%'].toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">Class_economics</th>\
                        <td>' + (feature.properties['Class_economics'] !== null ? autolinker.link(feature.properties['Class_economics'].toLocaleString()) : '') + '</td>\
                    </tr>\
                </table>';
            layer.bindPopup(popupContent, {maxHeight: 400});
            var popup = layer.getPopup();
            var content = popup.getContent();
            var updatedContent = removeEmptyRowsFromPopupContent(content, feature);
            popup.setContent(updatedContent);
        }

        function style_Austria_1_0(feature) {
            switch(String(feature.properties['Class_economics'])) {
                case '1':
                    return {
                pane: 'pane_Austria_1',
                radius: 4.0,
                opacity: 1,
                color: 'rgba(35,35,35,1.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1,
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(97,213,233,1.0)',
                interactive: true,
            }
                    break;
                case '2':
                    return {
                pane: 'pane_Austria_1',
                radius: 4.0,
                opacity: 1,
                color: 'rgba(35,35,35,1.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1,
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(122,227,65,1.0)',
                interactive: true,
            }
                    break;
                case '3':
                    return {
                pane: 'pane_Austria_1',
                radius: 4.0,
                opacity: 1,
                color: 'rgba(35,35,35,1.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1,
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(180,34,248,1.0)',
                interactive: true,
            }
                    break;
            }
        }
        map.createPane('pane_Austria_1');
        map.getPane('pane_Austria_1').style.zIndex = 401;
        map.getPane('pane_Austria_1').style['mix-blend-mode'] = 'normal';
        var layer_Austria_1 = new L.geoJson(json_Austria_1, {
            attribution: '',
            interactive: true,
            dataVar: 'json_Austria_1',
            layerName: 'layer_Austria_1',
            pane: 'pane_Austria_1',
            onEachFeature: pop_Austria_1,
            pointToLayer: function (feature, latlng) {
                var context = {
                    feature: feature,
                    variables: {}
                };
                return L.circleMarker(latlng, style_Austria_1_0(feature));
            },
        });
        bounds_group.addLayer(layer_Austria_1);
        map.addLayer(layer_Austria_1);
        function pop_Austria_2(feature, layer) {
            layer.on({
                mouseout: function(e) {
                    for (i in e.target._eventParents) {
                        e.target._eventParents[i].resetStyle(e.target);
                    }
                    if (typeof layer.closePopup == 'function') {
                        layer.closePopup();
                    } else {
                        layer.eachLayer(function(feature){
                            feature.closePopup()
                        });
                    }
                },
                mouseover: highlightFeature,
            });
            var popupContent = '<table>\
                    <tr>\
                        <th scope="row">Name</th>\
                        <td>' + (feature.properties['Name'] !== null ? autolinker.link(feature.properties['Name'].toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">Population</th>\
                        <td>' + (feature.properties['Population'] !== null ? autolinker.link(feature.properties['Population'].toLocaleString()) : '') + '</td>\
                    </tr>\
                </table>';
            layer.bindPopup(popupContent, {maxHeight: 400});
            var popup = layer.getPopup();
            var content = popup.getContent();
            var updatedContent = removeEmptyRowsFromPopupContent(content, feature);
            popup.setContent(updatedContent);
        }

        function style_Austria_2_0(feature) {
            if (feature.properties['Population'] >= 24115.000000 && feature.properties['Population'] <= 38344.000000 ) {
                return {
                pane: 'pane_Austria_2',
                radius: 4.0,
                opacity: 1,
                color: 'rgba(35,35,35,1.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1,
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(255,255,255,1.0)',
                interactive: true,
            }
            }
            if (feature.properties['Population'] >= 38344.000000 && feature.properties['Population'] <= 61221.000000 ) {
                return {
                pane: 'pane_Austria_2',
                radius: 4.0,
                opacity: 1,
                color: 'rgba(35,35,35,1.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1,
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(255,191,191,1.0)',
                interactive: true,
            }
            }
            if (feature.properties['Population'] >= 61221.000000 && feature.properties['Population'] <= 150887.000000 ) {
                return {
                pane: 'pane_Austria_2',
                radius: 4.0,
                opacity: 1,
                color: 'rgba(35,35,35,1.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1,
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(255,128,128,1.0)',
                interactive: true,
            }
            }
            if (feature.properties['Population'] >= 150887.000000 && feature.properties['Population'] <= 306068.000000 ) {
                return {
                pane: 'pane_Austria_2',
                radius: 4.0,
                opacity: 1,
                color: 'rgba(35,35,35,1.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1,
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(255,64,64,1.0)',
                interactive: true,
            }
            }
            if (feature.properties['Population'] >= 306068.000000 && feature.properties['Population'] <= 2028499.000000 ) {
                return {
                pane: 'pane_Austria_2',
                radius: 4.0,
                opacity: 1,
                color: 'rgba(35,35,35,1.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1,
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(255,0,0,1.0)',
                interactive: true,
            }
            }
        }
        map.createPane('pane_Austria_2');
        map.getPane('pane_Austria_2').style.zIndex = 402;
        map.getPane('pane_Austria_2').style['mix-blend-mode'] = 'normal';
        var layer_Austria_2 = new L.geoJson(json_Austria_2, {
            attribution: '',
            interactive: true,
            dataVar: 'json_Austria_2',
            layerName: 'layer_Austria_2',
            pane: 'pane_Austria_2',
            onEachFeature: pop_Austria_2,
            pointToLayer: function (feature, latlng) {
                var context = {
                    feature: feature,
                    variables: {}
                };
                return L.circleMarker(latlng, style_Austria_2_0(feature));
            },
        });
        bounds_group.addLayer(layer_Austria_2);
        map.addLayer(layer_Austria_2);
            var title = new L.Control();
            title.onAdd = function (map) {
                this._div = L.DomUtil.create('div', 'info');
                this.update();
                return this._div;
            };
            title.update = function () {
                this._div.innerHTML = '<h2>Социально-экономическая карта Австрии</h2>';
            };
            title.addTo(map);
            var abstract = new L.Control({'position':'topleft'});
            abstract.onAdd = function (map) {
                this._div = L.DomUtil.create('div',
                'leaflet-control abstract');
                this._div.id = 'abstract'

                    abstract.show();
                    return this._div;
                };
                abstract.show = function () {
                    this._div.classList.remove("abstract");
                    this._div.classList.add("abstractUncollapsed");
                    this._div.innerHTML = 'На данной карте можно просмотреть данные по городскому населению Австрии, а также сектора экономики по которым эти города разделяются.';
            };
            abstract.addTo(map);
        var baseMaps = {};
        L.control.layers(baseMaps,{'Austria<br /><table><tr><td style="text-align: center;"><img src="legend/Austria_2_24115383440.png" /></td><td>24115 - 38344</td></tr><tr><td style="text-align: center;"><img src="legend/Austria_2_38344612211.png" /></td><td>38344 - 61221</td></tr><tr><td style="text-align: center;"><img src="legend/Austria_2_612211508872.png" /></td><td>61221 - 150887</td></tr><tr><td style="text-align: center;"><img src="legend/Austria_2_1508873060683.png" /></td><td>150887 - 306068</td></tr><tr><td style="text-align: center;"><img src="legend/Austria_2_30606820284994.png" /></td><td>306068 - 2028499</td></tr></table>': layer_Austria_2,'Austria копия<br /><table><tr><td style="text-align: center;"><img src="legend/Austria_1_10.png" /></td><td>1</td></tr><tr><td style="text-align: center;"><img src="legend/Austria_1_21.png" /></td><td>2</td></tr><tr><td style="text-align: center;"><img src="legend/Austria_1_32.png" /></td><td>3</td></tr></table>': layer_Austria_1,"ESRI Standard": layer_ESRIStandard_0,}).addTo(map);
        setBounds();
        </script>
    </body>
</html>
